<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda — TickyService</title>
<meta name="description" content="Notebooks, PC armadas, consolas, joysticks y repuestos en Mar de Ajó. Precios de referencia, stock y valor final se confirman por WhatsApp.">
<!-- hex justificado: <meta> no lee variables CSS (= --brand-700 en tokens.css) -->
<meta name="theme-color" content="#470C78">
<link rel="icon" type="image/png" href="img/logo/fondo.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Tienda — TickyService">
<meta property="og:description" content="Notebooks, PC armadas, consolas, joysticks y repuestos en Mar de Ajó.">
<meta property="og:image" content="img/logo/fondo.png">
<meta property="og:locale" content="es_AR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/tienda.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido principal</a>

<!-- ============ ÍCONOS PROPIOS DE LA PÁGINA (menú y WhatsApp los agrega js/layout.js) ============ -->
<svg class="icon-sprite" aria-hidden="true">
  <defs>
    <symbol id="icon-laptop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M2 20h20"/></symbol>
    <symbol id="icon-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="icon-gamepad" viewBox="0 0 24 24"><path d="M7 9h10a4 4 0 0 1 4 4v1a3 3 0 0 1-5.4 1.8L14 14h-4l-1.6 1.8A3 3 0 0 1 3 15v-1a4 4 0 0 1 4-4z"/><path d="M7.5 11.5v2M6.5 12.5h2M16 12h.01M18 14h.01"/></symbol>
    <symbol id="icon-console" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="4"/><circle cx="7" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="17" cy="12" r="1.1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-battery" viewBox="0 0 24 24"><rect x="2" y="8" width="18" height="8" rx="1.5"/><path d="M22 11v2M5 11v2M8 11v2"/></symbol>
    <symbol id="icon-plug" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M7 8h10v3a5 5 0 0 1-10 0V8z"/><path d="M12 16v6"/></symbol>
    <symbol id="icon-memory" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="10" rx="1.5"/><path d="M7 6V3M11 6V3M15 6V3M7 16v3M11 16v3M15 16v3"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".6" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<div id="site-header"></div>
<script src="js/config.js"></script>
<script src="js/layout.js"></script>

<main id="main">

  <section class="shop" id="tienda" aria-labelledby="shop-title">
    <div class="container">
      <div class="shop-head">
        <div>
          <p class="gh-eyebrow">Equipos y repuestos</p>
          <h1 class="shop-title" id="shop-title">Tienda</h1>
          <p class="shop-sub">Equipos y repuestos para notebooks, PC, consolas y joysticks.</p>
        </div>
        <div class="shop-note">
          <i data-lucide="info"></i>
          <span>Precios de referencia. Tocá una card y te confirmamos stock y valor por WhatsApp.</span>
        </div>
      </div>

      <div class="shop-filters">
        <div class="shop-pills" id="shop-pills"></div>
        <button class="shop-toggle" id="shop-toggle" role="switch" aria-checked="false">
          <span class="shop-switch"></span>Solo con stock
        </button>
      </div>

      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/tienda.js"></script>

</body>
</html>
